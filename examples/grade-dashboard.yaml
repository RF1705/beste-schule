type: grid
columns: 3
square: false
cards:
  - type: custom:mushroom-template-card
    entity: sensor.test_note_biologie
    primary: Biologie
    secondary: >
      {% set current = states(entity) %} {% set previous = state_attr(entity,
      '2025/26') %} {% if current not in ['unknown', 'unavailable', 'Unbekannt',
      ''] %}
        Ø {{ current }}
        {% if previous is not none and previous|string not in ['unknown', 'unavailable', 'Unbekannt', ''] %}
          · Vorjahr {{ previous|string|replace('.', ',') }}
        {% endif %}
      {% else %}
        Noch keine Note
      {% endif %}
    icon: mdi:leaf
    icon_color: >
      {% set s = states(entity) %} {% if s in ['unknown', 'unavailable',
      'Unbekannt', ''] %}
        grey
      {% else %}
        {% set n = s|replace(',', '.')|float(0) %}
        {% if n <= 2.5 %}green
        {% elif n <= 3.5 %}light-green
        {% elif n < 5 %}orange
        {% else %}red
        {% endif %}
      {% endif %}
    tap_action:
      action: more-info
