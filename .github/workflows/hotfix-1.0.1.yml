name: Hotfix 1.0.1

on:
  push:
    paths:
      - .github/workflows/hotfix-1.0.1.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply timetable API hotfix
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          api_path = Path("custom_components/beste_schule/api.py")
          api = api_path.read_text()
          old = '''            self._request_first_available_cached(
                ("time-tables/current", None),
                cache_key="time_tables_current",
                max_age=SHARED_DATA_CACHE_SECONDS,
            ),'''
          new = '''            self._request_first_available_cached(
                (
                    "time-tables/current",
                    {"include": "lessons.times"},
                ),
                cache_key="time_tables_current",
                max_age=SHARED_DATA_CACHE_SECONDS,
            ),'''
          if api.count(old) != 1:
              raise SystemExit("Expected timetable request block not found exactly once")
          api_path.write_text(api.replace(old, new, 1))

          test_path = Path("tests/test_api.py")
          tests = test_path.read_text()
          marker = "test_fetch_overview_requests_timetable_lesson_times"
          if marker not in tests:
              tests += '''\n\n@pytest.mark.asyncio\nasync def test_fetch_overview_requests_timetable_lesson_times() -> None:\n    \"\"\"The current timetable must explicitly include per-lesson times.\"\"\"\n    api = object.__new__(BesteSchuleApi)\n    api._response_cache = {}\n    api._request_first_available_cached = AsyncMock(return_value={\"data\": []})\n    api._request_routes = AsyncMock(return_value={})\n    api._fetch_finalgrade_details = AsyncMock(return_value={})\n    api._fetch_grade_years = AsyncMock(return_value={})\n\n    await api.fetch_overview(students={\"data\": [{\"id\": 1}]})\n\n    assert any(\n        args[0] == (\"time-tables/current\", {\"include\": \"lessons.times\"})\n        and kwargs.get(\"cache_key\") == \"time_tables_current\"\n        for args, kwargs in api._request_first_available_cached.call_args_list\n    )\n'''
              test_path.write_text(tests)

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text()
          if "## 1.0.1 - 2026-08-17" not in changelog:
              heading = "# Changelog\n\n"
              entry = '''## 1.0.1 - 2026-08-17\n\n### Fixed\n\n- Restore timetable calendar events after beste.schule moved lesson times behind the `lessons.times` include relation.\n- Keep compatibility with the new per-lesson `time` object containing `from` and `to`.\n\n'''
              if not changelog.startswith(heading):
                  raise SystemExit("Unexpected changelog header")
              changelog_path.write_text(heading + entry + changelog[len(heading):])

          manifest_path = Path("custom_components/beste_schule/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          if manifest.get("version") != "1.0.0":
              raise SystemExit(f"Unexpected current version: {manifest.get('version')}")
          manifest["version"] = "1.0.1"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Run tests and quality checks
        run: |
          python -m pytest
          ruff check custom_components tests
          ruff format --check custom_components tests

      - name: Commit hotfix to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/beste_schule/api.py custom_components/beste_schule/manifest.json tests/test_api.py CHANGELOG.md
          git commit -m "Fix timetable lesson times for v1.0.1"
          git push origin HEAD:main

      - name: Create integration ZIP
        working-directory: custom_components/beste_schule
        run: zip -r "${{ github.workspace }}/beste_schule.zip" .

      - name: Create v1.0.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.1 \
            --target main \
            --title "beste.schule v1.0.1" \
            --notes $'## Fixed\n\n- Restore timetable calendar events with the new beste.schule API by requesting `lessons.times`.\n- Support the new per-lesson `time` relation containing `from` and `to`.' \
            beste_schule.zip
