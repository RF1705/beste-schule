name: Hotfix 1.0.2

on:
  push:
    paths:
      - .github/workflows/hotfix-1.0.2.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply timetable row grouping hotfix
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          calendar_path = Path("custom_components/beste_schule/calendar.py")
          calendar = calendar_path.read_text()
          old_calendar = '''                try:\n                    period_map.setdefault(int(number), (start_time, end_time))\n                except (TypeError, ValueError):\n                    continue\n\n    return period_map\n'''
          new_calendar = '''                try:\n                    period_map.setdefault(int(number), (start_time, end_time))\n                except (TypeError, ValueError):\n                    continue\n\n    # Since August 2026, timetable lesson times may only be available on the\n    # included lessons.times relation instead of the school metadata.\n    for lesson in _iter_values(data.get("time_tables_current")):\n        if not isinstance(lesson, dict):\n            continue\n        number = _find_direct_value(lesson, LESSON_NR_KEYS)\n        lesson_time = lesson.get("time")\n        if number is None or not isinstance(lesson_time, dict):\n            continue\n        start_time = _parse_time(_find_value(lesson_time, START_KEYS))\n        end_time = _parse_time(_find_value(lesson_time, END_KEYS))\n        if start_time is None or end_time is None:\n            continue\n        try:\n            period_map.setdefault(int(number), (start_time, end_time))\n        except (TypeError, ValueError):\n            continue\n\n    return period_map\n'''
          if old_calendar not in calendar:
              raise SystemExit("Could not find _period_time_map return block")
          calendar_path.write_text(calendar.replace(old_calendar, new_calendar, 1))

          sensor_path = Path("custom_components/beste_schule/sensor.py")
          sensor = sensor_path.read_text()
          old_setup = '''    rows: dict[int, dict[str, Any]] = {}\n    fallback_number = 100\n'''
          new_setup = '''    rows: dict[int, dict[str, Any]] = {}\n    fallback_numbers: dict[tuple[str, str], int] = {}\n    fallback_number = 100\n'''
          if old_setup not in sensor:
              raise SystemExit("Could not find timetable fallback setup")
          sensor = sensor.replace(old_setup, new_setup, 1)

          old_fallback = '''        if number is None:\n            number = fallback_number\n            fallback_number += 1\n'''
          new_fallback = '''        if number is None:\n            fallback_key = (start, end)\n            number = fallback_numbers.get(fallback_key)\n            if number is None:\n                number = fallback_number\n                fallback_numbers[fallback_key] = number\n                fallback_number += 1\n'''
          if old_fallback not in sensor:
              raise SystemExit("Could not find timetable fallback assignment")
          sensor_path.write_text(sensor.replace(old_fallback, new_fallback, 1))

          calendar_test_path = Path("tests/test_calendar.py")
          calendar_tests = calendar_test_path.read_text()
          calendar_tests = calendar_tests.replace(
              "from datetime import datetime, timedelta",
              "from datetime import datetime, time, timedelta",
              1,
          )
          marker = "test_period_time_map_uses_timetable_lesson_time_relation"
          if marker not in calendar_tests:
              calendar_tests += '''\n\ndef test_period_time_map_uses_timetable_lesson_time_relation() -> None:\n    \"\"\"The timetable include must provide period numbers and their new time relation.\"\"\"\n    data = {\n        \"time_tables_current\": {\n            \"data\": {\n                \"lessons\": [\n                    {\n                        \"nr\": 3,\n                        \"time\": {\"from\": \"09:50\", \"to\": \"10:35\"},\n                    }\n                ]\n            }\n        }\n    }\n\n    assert calendar._period_time_map(data) == {3: (time(9, 50), time(10, 35))}\n'''
          calendar_test_path.write_text(calendar_tests)

          sensor_test_path = Path("tests/test_sensor.py")
          sensor_tests = sensor_test_path.read_text()
          sensor_tests = sensor_tests.replace(
              "from datetime import datetime",
              "from datetime import datetime, timedelta",
              1,
          )
          if "from homeassistant.components.calendar import CalendarEvent" not in sensor_tests:
              sensor_tests = sensor_tests.replace(
                  "import pytest\n",
                  "from homeassistant.components.calendar import CalendarEvent\nimport pytest\n",
                  1,
              )
          marker = "test_timetable_card_fallback_groups_matching_times"
          if marker not in sensor_tests:
              sensor_tests += '''\n\ndef test_timetable_card_fallback_groups_matching_times(monkeypatch) -> None:\n    \"\"\"Fallback rows with the same lesson time must share one card row.\"\"\"\n    now = datetime(2026, 8, 17, 7, tzinfo=ZoneInfo(\"Europe/Berlin\"))\n    monday = now.replace(hour=9, minute=50)\n    tuesday = monday + timedelta(days=1)\n    events = [\n        CalendarEvent(\n            summary=\"Musik\",\n            start=monday,\n            end=monday + timedelta(minutes=45),\n        ),\n        CalendarEvent(\n            summary=\"Deutsch\",\n            start=tuesday,\n            end=tuesday + timedelta(minutes=45),\n        ),\n    ]\n    coordinator = SimpleNamespace(\n        data={},\n        data_revision=1,\n        timetable_card_cache={},\n    )\n    monkeypatch.setattr(sensor.dt_util, \"now\", lambda: now)\n    monkeypatch.setattr(\n        sensor,\n        \"_coordinator_lesson_events\",\n        lambda *args, **kwargs: events,\n    )\n\n    rows = _timetable_card_rows(coordinator, 0)\n\n    assert len(rows) == 1\n    assert rows[0][\"Mo\"] == \"Musik\"\n    assert rows[0][\"Di\"] == \"Deutsch\"\n'''
          sensor_test_path.write_text(sensor_tests)

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text()
          if "## 1.0.2 - 2026-08-17" not in changelog:
              heading = "# Changelog\n\n"
              entry = '''## 1.0.2 - 2026-08-17\n\n### Fixed\n\n- Restore timetable-card lesson-number mapping from the new `lessons.times` relation.\n- Keep fallback timetable rows grouped by identical start/end times when no lesson number can be resolved.\n\n'''
              if not changelog.startswith(heading):
                  raise SystemExit("Unexpected changelog header")
              changelog_path.write_text(heading + entry + changelog[len(heading):])

          manifest_path = Path("custom_components/beste_schule/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          if manifest.get("version") != "1.0.1":
              raise SystemExit(f"Unexpected current version: {manifest.get('version')}")
          manifest["version"] = "1.0.2"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Run tests and quality checks
        run: |
          python -m pytest
          ruff check custom_components tests
          ruff format --check custom_components tests

      - name: Commit hotfix to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/hotfix-1.0.2.yml
          git add custom_components/beste_schule/calendar.py custom_components/beste_schule/sensor.py custom_components/beste_schule/manifest.json tests/test_calendar.py tests/test_sensor.py CHANGELOG.md
          git commit -m "Fix timetable row grouping for v1.0.2"
          git push origin HEAD:main

      - name: Create integration ZIP
        working-directory: custom_components/beste_schule
        run: zip -r "${{ github.workspace }}/beste_schule.zip" .

      - name: Create v1.0.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.2 \
            --target main \
            --title "beste.schule v1.0.2" \
            --notes $'## Fixed\n\n- Restore timetable-card lesson-number mapping after beste.schule moved lesson times to the `lessons.times` relation.\n- Group identical fallback time slots into one timetable row instead of generating separate IDs for each weekday.' \
            beste_schule.zip
